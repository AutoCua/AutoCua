<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCua Splash</title>
  <style>
    /* ------------------------------------------------------------------
       Splash: the AutoCua team, after workos.com/atlas. The bots come in
       as Atlas's hero (one big bot, out of a blur, waking up), then shrink
       into place while the others fan out from behind it into Atlas's
       "Build your AI team" lineup, standing on the bottom edge of the
       window, and "Automatic Computer use agent" rises in the middle of
       the window and collapses into "AutoCua".

       The bots are AutoCua/logo/<bot>.html cut out of their backdrop and
       cropped edge to edge (one crop box for all five, so they share one
       scale and one helmet line) into three stacked layers each, in
       ui/bots/: the body, the eyes and the glass shine. The eyes are their
       own layer so they can open and blink between body and shine.

       The lineup (Atlas's, a little closer together, in bot widths):
       Computer use in the middle at 1x, Mobile and Coder use at 0.8x, 0.92
       out, Web and Scraper use at 0.6x, 1.64 out, the middle one in front,
       all standing on one line and fading out over their lower third.

       Timeline (from the moment the bot images are decoded):
         0.10s           the team fades in (0.35s) at 1.75x, pushed down (at
                         least enough to keep the big lead's head below the
                         title): only Computer use shows, the others wait
                         behind it, see-through. It grows from 0.85x of that
                         as a 6px blur sharpens (1s, ease "settle")
         0.42s - 1.02s   its eyes wake; a blink at 1.22s
         1.50s - 3.30s   the team shrinks to 1x and rises into place on the
                         bottom edge (1.8s, ease "inOutExpo": slow, fast,
                         slow)
         2.20s - 3.30s   the others fan out from behind it (1s, Atlas's
                         lineup ease; the outer pair 0.05s later), fading in
                         as one group from 2.30s (0.5s), waking
         1.50s - 4.40s   "Automatic Computer use agent" rises in the middle
                         of the window out of a 4px blur (the big lead never
                         reaches up to it), then collapses into "AutoCua"
         4.50s - 5.50s   "AutoCua" stays and one shimmer crosses it (Atlas's
                         sheen); the bots blink along with it, left to right
         5.75s           postMessage('splashDone') -> script.js fades the
                         overlay over 0.9s (a watchdog posts it anyway if
                         anything here fails)
       With reduced motion: the lineup and "AutoCua", still, and the
       hand-off at 0.60s.

       THE MOTION RUNS ON THE COMPOSITOR
       ---------------------------------
       This plays in an iframe on top of the booting app, which keeps the
       main thread busy, so anything that needs the main thread can stall.
       Every move here is `transform` or `opacity`, each element has at most
       one animation per property (Chromium keeps two animations of one
       property on the main thread), and every animation is created in one
       task up front with its own delay, so a late timer cannot shift it.
       Only the two blurs (the hero's and the headline's) need the main
       thread in Chromium. They are animations of their own, so a stall can
       pause a blur, never a move:

         - The team is laid out at its biggest and only ever scaled down,
           so the bots stay sharp on every engine.
         - Every letter is its own flex item, so it can fade and move on its
           own; the collapse is translateX on the kept letters, never a
           width or a margin.
       ------------------------------------------------------------------ */
    html, body {
      margin: 0;
      height: 100%;
      /* Pure white. The app uses the same colour: .splash-overlay,
         .settings-overlay and the body (css/style.css), the left bar, the
         Skills stage, the setup page and TITLEBAR_COLOR (service.py). */
      background: #FFFFFF;
      overflow: hidden;
    }

    /* --- 1. The team: lift (fade + rise) > row (grow and shrink, blur) >
       side (the four others' fade) > slot (fan-out) > bot. Placed and sized
       by the script below. --- */
    .lift {
      position: fixed;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }
    .row {
      position: absolute;
      left: 0;
      right: 0;
      transform-origin: 50% 100%;   /* Atlas: grows and shrinks from its feet */
    }
    /* The four side bots fade in as ONE group, behind the lead: while they
       still overlap, the inner ones then hide the outer ones like solid
       things, instead of showing through each other and through the lead's
       see-through lower third. */
    .side {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0;
    }
    .slot {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform-origin: 50% 100%;   /* each bot stands on the one line */
    }
    .bot {
      position: absolute;
      inset: 0;
      /* Atlas's lineup: each bot fades out over its lower third. */
      -webkit-mask-image: linear-gradient(#000 66%, transparent 100%);
              mask-image: linear-gradient(#000 66%, transparent 100%);
    }
    .bot img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Opens and blinks with scaleY around the eyes' own centre line: a
       share of the cropped bot's height (the build's eye line). */
    .bot .eyes {
      opacity: 0;
      transform-origin: 50% 24.74%;
    }

    /* --- 2. "Automatic Computer use agent" -> "AutoCua" --- */
    .title {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 1;       /* over the team while it is still big */
      display: flex;
      justify-content: center;
      font: 500 min(5vmin, 40px)/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #A0A0A8;   /* a light cool grey */
      -webkit-user-select: none;
      user-select: none;
    }
    .title i { font-style: normal; }

    /* Atlas's headline rise: up from a little below, out of a 4px blur.
       The blur is an animation of its own: Chromium runs a blur on the main
       thread only, and mixed in, it would keep the rise there too. */
    .word {
      display: flex;
      opacity: 0;
      transform: translateY(0.3em);
      filter: blur(4px);
      will-change: transform, opacity, filter;
    }
    .keep { will-change: transform; }
    .fade { will-change: transform, opacity; }

    /* --t0: when the title starts, set by the script. One delay serves both
       animations. */
    .go .word {
      animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 unblur 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .go .word:nth-of-type(1) { animation-delay: calc(var(--t0) + 0.00s); }
    .go .word:nth-of-type(2) { animation-delay: calc(var(--t0) + 0.08s); }
    .go .word:nth-of-type(3) { animation-delay: calc(var(--t0) + 0.16s); }
    .go .word:nth-of-type(4) { animation-delay: calc(var(--t0) + 0.24s); }

    @keyframes rise {
      to { opacity: 1; transform: none; }
    }
    @keyframes unblur {
      to { filter: blur(0px); }
    }

    /* The faded letters always trail their word's kept ones, so counting from
       the word's end gives the far-end-first order. */
    .go .fade { animation: dissolve 0.32s cubic-bezier(0.45, 0, 0.55, 1) forwards; }
    .go .fade:nth-last-child(1) { animation-delay: calc(var(--t0) + 1.500s); }
    .go .fade:nth-last-child(2) { animation-delay: calc(var(--t0) + 1.545s); }
    .go .fade:nth-last-child(3) { animation-delay: calc(var(--t0) + 1.590s); }
    .go .fade:nth-last-child(4) { animation-delay: calc(var(--t0) + 1.635s); }
    .go .fade:nth-last-child(5) { animation-delay: calc(var(--t0) + 1.680s); }
    .go .fade:nth-last-child(6) { animation-delay: calc(var(--t0) + 1.725s); }
    .go .fade:nth-last-child(7) { animation-delay: calc(var(--t0) + 1.770s); }

    @keyframes dissolve {
      to { opacity: 0; transform: translateX(-0.12em) scale(0.85); }
    }

    /* Once the slide lands, the faded letters and gaps leave the layout and
       the kept letters sit in plain flow as one word, on the same pixels the
       slide ended on, with no layers left behind. */
    .settled .fade, .settled .gap { display: none; }
    .settled .word { opacity: 1; transform: none; filter: none; animation: none; will-change: auto; }
    .settled .keep { will-change: auto; }

    /* --- 3. One shimmer across "AutoCua" once it has formed: a darker
       copy of the word, seen through a soft band. Atlas's sheen: the band
       (a mask on the window) travels one way while the copy inside moves
       the other, so the copy stays on the word and only the light moves.
       Same font and the same letter-per-box layout as the title, so the
       copy lands on the very same pixels. --- */
    .sheen {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 2;
      pointer-events: none;
      font: 500 min(5vmin, 40px)/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-mask-image: linear-gradient(90deg, transparent calc(50% - 1.6em), #000 50%, transparent calc(50% + 1.6em));
              mask-image: linear-gradient(90deg, transparent calc(50% - 1.6em), #000 50%, transparent calc(50% + 1.6em));
      -webkit-user-select: none;
      user-select: none;
    }
    .sheen-art {
      display: flex;
      justify-content: center;
      color: #5C6270;   /* the gleam: a deeper cool grey */
    }
    .sheen-art i { font-style: normal; }
  </style>
</head>
<body>

  <div class="lift">
    <div class="row">
      <div class="side">
        <div class="slot"><div class="bot" role="img" aria-label="Web use"><img src="bots/webuse.webp" alt=""><img class="eyes" src="bots/webuse-eyes.webp" alt=""><img src="bots/webuse-shine.webp" alt=""></div></div>
        <div class="slot"><div class="bot" role="img" aria-label="Mobile use"><img src="bots/mobileuse.webp" alt=""><img class="eyes" src="bots/mobileuse-eyes.webp" alt=""><img src="bots/mobileuse-shine.webp" alt=""></div></div>
        <div class="slot"><div class="bot" role="img" aria-label="Coder use"><img src="bots/coderuse.webp" alt=""><img class="eyes" src="bots/coderuse-eyes.webp" alt=""><img src="bots/coderuse-shine.webp" alt=""></div></div>
        <div class="slot"><div class="bot" role="img" aria-label="Scraper use"><img src="bots/scraperuse.webp" alt=""><img class="eyes" src="bots/scraperuse-eyes.webp" alt=""><img src="bots/scraperuse-shine.webp" alt=""></div></div>
      </div>
      <div class="slot lead"><div class="bot" role="img" aria-label="Computer use"><img src="bots/computeruse.webp" alt=""><img class="eyes" src="bots/computeruse-eyes.webp" alt=""><img src="bots/computeruse-shine.webp" alt=""></div></div>
    </div>
  </div>

  <div class="title" role="img" aria-label="AutoCua: Automatic Computer use agent">
    <span class="word"><i class="keep">A</i><i class="keep">u</i><i class="keep">t</i><i class="keep">o</i><i class="fade">m</i><i class="fade">a</i><i class="fade">t</i><i class="fade">i</i><i class="fade">c</i></span>
    <i class="gap">&nbsp;</i>
    <span class="word"><i class="keep">C</i><i class="fade">o</i><i class="fade">m</i><i class="fade">p</i><i class="fade">u</i><i class="fade">t</i><i class="fade">e</i><i class="fade">r</i></span>
    <i class="gap">&nbsp;</i>
    <span class="word"><i class="keep">u</i><i class="fade">s</i><i class="fade">e</i></span>
    <i class="gap">&nbsp;</i>
    <span class="word"><i class="keep">a</i><i class="fade">g</i><i class="fade">e</i><i class="fade">n</i><i class="fade">t</i></span>
  </div>

  <div class="sheen" aria-hidden="true"><div class="sheen-art"><i>A</i><i>u</i><i>t</i><i>o</i><i>C</i><i>u</i><i>a</i></div></div>

  <script>
    (function () {
      'use strict';

      var reduced = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // script.js fades .splash-overlay over 0.9s from this message. Opened
      // standalone there is no parent, so nothing is posted. Posted once.
      var handed = false;
      function handOff() {
        if (handed) return;
        handed = true;
        if (window.parent && window.parent !== window) {
          window.parent.postMessage('splashDone', '*');
        }
      }

      // ---- timing, ms from the start: Atlas's hero entrance -------------
      var FIRST = 100;
      var FADE = 350;                       // the team fades in, linear
      var GROW = 1000;                      // 0.85x -> 1x and blur 6px -> 0
      var WAKE_AT = 320, WAKE = 600;        // the lead's eyes open
      var BLINK1_AT = 1120;                 // and blink, just after waking
      var SHRINK_AT = 1400, SHRINK = 1800;  // big -> 1x, rising into place
      // Atlas's lineup fan-out, as the shrink speeds up. The side bots fade
      // in as one group, just after they start to move.
      var FAN_AT = SHRINK_AT + 700, FAN = 1000;
      var SIDE_AT = FAN_AT + 100, SIDE_FADE = 500;
      var T0 = FIRST + SHRINK_AT;           // the title, with the shrink (Atlas)
      var SLIDE_AT = T0 + 1900, SLIDE = 900;
      // "AutoCua" stays; one shimmer crosses it, the bots blink along with
      // it, left to right, then the hand-off.
      var SHEEN_AT = SLIDE_AT + SLIDE + 200, SHEEN = 1000;
      var BLINK_AT = SHEEN_AT + 100, BLINK_GAP = 150, BLINK = 300;
      var END = SHEEN_AT + SHEEN + 250;
      var DECODE_MAX = 1500;                // the longest wait for the images
      var EASE_SHEEN = 'cubic-bezier(0.4, 0, 0.6, 1)';     // Atlas sheen
      var EASE_SETTLE = 'cubic-bezier(0.16, 1, 0.3, 1)';   // Atlas "settle"
      var EASE_EXPO = 'cubic-bezier(0.87, 0, 0.13, 1)';    // Atlas "inOutExpo"
      var EASE_OUT = 'cubic-bezier(0.33, 1, 0.68, 1)';     // Atlas "outCubic"
      var EASE_FAN = 'cubic-bezier(0.2, 0.8, 0.2, 1)';     // Atlas lineup

      // Whatever happens below, the app is never left under the splash.
      setTimeout(handOff, DECODE_MAX + END + 1000);

      // The lineup, left to right: offset (bot widths), scale, extra delay.
      // Atlas's "Build your AI team" (+-149.4 / +-265.6 of a 142px robot,
      // so 1.05 / 1.87 bot widths), drawn a little closer together.
      var TEAM = [[-1.64, 0.6, 50], [-0.92, 0.8, 0], [0, 1, 0], [0.92, 0.8, 0], [1.64, 0.6, 50]];
      var LEAD = 2;

      // ---- geometry ------------------------------------------------------
      var ASPECT = 520 / 720;     // the cropped bot images, width / height
      var lift = document.querySelector('.lift');
      var row = document.querySelector('.row');
      var side = document.querySelector('.side');
      // The slots in TEAM's order, left to right (in the markup the lead
      // comes last, in front of the side group).
      var slots = ['Web use', 'Mobile use', 'Computer use', 'Coder use', 'Scraper use'].map(function (name) {
        return document.querySelector('.bot[aria-label="' + name + '"]').parentNode;
      });
      var title = document.querySelector('.title');
      var sheen = document.querySelector('.sheen');
      var sheenArt = document.querySelector('.sheen-art');
      var zoom = null, rise = null, fans = [], sweep = null, still = null;

      function geometry() {
        var W = window.innerWidth, H = window.innerHeight, vmin = Math.min(W, H);
        var g = {};
        // "AutoCua" in the middle of the window...
        var line = parseFloat(getComputedStyle(title).fontSize) * 1.2;
        g.titleTop = H / 2 - line / 2;
        var clear = H / 2 + line / 2 + Math.min(0.03 * vmin, 24);   // below the title
        // ...and the team standing on the bottom edge (their lower third
        // fades out, so they rise out of it), the lead's head below the title.
        g.feet = H;
        g.h = Math.min(0.36 * vmin, 0.29 * W, 280, g.feet - clear);  // the lead, at the end
        g.w = g.h * ASPECT;
        // Atlas: 1.75x while big, pushed down a little, rising into place as
        // it shrinks. Pushed down further where it takes that for the big
        // lead's head to stay below the title. The width needs no check:
        // while big only the lead shows (at most 0.37 W wide), and the lineup
        // fits (g.h <= 0.29 W keeps it within 0.81 W).
        g.big = 1.75;
        g.drop = Math.max(28, Math.round(H * 0.06), Math.ceil(clear + g.h * g.big - g.feet));
        return g;
      }

      // A side bot waiting behind the lead (Atlas: a little low, at 96%,
      // see-through), and in its place in the lineup. In row units: the row
      // is laid out big.
      function behind(g, i) {
        return 'translate(0px, ' + (0.08 * g.h * g.big) + 'px) scale(' + (0.96 * TEAM[i][1]) + ')';
      }
      function placed(g, i) {
        return 'translate(' + (TEAM[i][0] * g.w * g.big) + 'px, 0px) scale(' + TEAM[i][1] + ')';
      }

      // The row is laid out at its big size with its feet on the final line,
      // so shrinking around its feet lands it exactly in place.
      function layout() {
        var g = geometry(), B = g.big;
        row.style.height = (g.h * B) + 'px';
        row.style.top = (g.feet - g.h * B) + 'px';
        slots.forEach(function (s, i) {
          s.style.width = (g.w * B) + 'px';
          s.style.height = (g.h * B) + 'px';
          s.style.marginLeft = (-g.w * B / 2) + 'px';
          s.style.zIndex = 5 - Math.abs(i - LEAD);   // the lead in front
          if (fans[i]) fans[i].effect.setKeyframes([{ transform: behind(g, i) }, { transform: placed(g, i) }]);
        });
        title.style.top = g.titleTop + 'px';
        sheen.style.top = g.titleTop + 'px';
        if (sweep) {
          var k = sheenTravel();
          sweep.effect.setKeyframes([{ transform: 'translateX(' + (-k) + 'px)' }, { transform: 'translateX(' + k + 'px)' }]);
          still.effect.setKeyframes([{ transform: 'translateX(' + k + 'px)' }, { transform: 'translateX(' + (-k) + 'px)' }]);
        }
        if (zoom) zoom.effect.setKeyframes(rowFrames(B));
        if (rise) rise.effect.setKeyframes([{ transform: 'translateY(' + g.drop + 'px)' }, { transform: 'translateY(0px)' }]);
        return g;
      }

      // The end state, still: the lineup under "AutoCua".
      function settle() {
        var g = layout();
        lift.style.opacity = 1;
        side.style.opacity = 1;
        row.style.transform = 'scale(' + (1 / g.big) + ')';
        slots.forEach(function (s, i) {
          s.style.transform = placed(g, i);
          s.querySelector('.eyes').style.opacity = 1;
        });
        title.classList.add('settled');
        sheen.style.display = 'none';   // no shimmer when still
      }

      // --------------------------------------------------------------
      // The collapse. Each kept letter slides from where the full phrase
      // put it to where it sits in "AutoCua", centred on the same point,
      // which is exactly where plain layout puts it once .settled drops the
      // rest. Distances are in em: the font size is vmin-based and the line
      // is centred, so a resize mid-slide scales them with the text.
      // --------------------------------------------------------------
      var SLIDE_EASE = 'cubic-bezier(0.65, 0, 0.35, 1)';
      function titleIn() {
        title.style.setProperty('--t0', T0 + 'ms');
        try {
          var em = parseFloat(getComputedStyle(title).fontSize);
          var letters = title.querySelectorAll('i');
          var centre = (letters[0].getBoundingClientRect().left +
                        letters[letters.length - 1].getBoundingClientRect().right) / 2;
          var keeps = [].slice.call(title.querySelectorAll('.keep'));
          var rects = keeps.map(function (el) { return el.getBoundingClientRect(); });
          var x = centre - rects.reduce(function (w, r) { return w + r.width; }, 0) / 2;

          var slides = keeps.map(function (el, i) {
            var dx = (x - rects[i].left) / em;
            x += rects[i].width;
            return el.animate(
              [{ transform: 'translateX(0)' }, { transform: 'translateX(' + dx + 'em)' }],
              { delay: SLIDE_AT, duration: SLIDE, easing: SLIDE_EASE, fill: 'forwards' }
            );
          });
          title.classList.add('go');

          Promise.all(slides.map(function (a) { return a.finished; })).then(function () {
            title.classList.add('settled');
            slides.forEach(function (a) { a.cancel(); });
          });
        } catch (e) {
          title.classList.add('settled');   // no slide, but never a blank title
        }
      }

      // How far the band travels: from just left of "AutoCua" to just right.
      function sheenTravel() {
        var first = sheenArt.firstElementChild.getBoundingClientRect();
        var last = sheenArt.lastElementChild.getBoundingClientRect();
        return (last.right - first.left) / 2 + 1.6 * parseFloat(getComputedStyle(sheen).fontSize);
      }

      // The row's ONE transform animation: it grows from 0.85x (ease
      // "settle"), holds, then shrinks to 1x around its feet (ease
      // "inOutExpo"). It is laid out big, so 1x is scale(1/B).
      function rowFrames(B) {
        var D = SHRINK_AT + SHRINK;
        return [{ offset: 0, transform: 'scale(0.85)', easing: EASE_SETTLE },
                { offset: GROW / D, transform: 'scale(1)' },
                { offset: SHRINK_AT / D, transform: 'scale(1)', easing: EASE_EXPO },
                { offset: 1, transform: 'scale(' + (1 / B) + ')' }];
      }

      // A pair of eyes' ONE animation: they wake at `at` (open out of a line,
      // ease "outCubic"), then blink at each of the `blinks` times: shut,
      // about a frame closed, open again.
      function wake(eyes, at, blinks) {
        var span = blinks[blinks.length - 1] + BLINK - at;
        function key(t, open, easing) {
          return { offset: (t - at) / span, opacity: 1, transform: 'scaleY(' + open + ')', easing: easing || 'linear' };
        }
        var frames = [{ offset: 0, opacity: 0, transform: 'scaleY(0.06)', easing: EASE_OUT }, key(at + WAKE, 1)];
        blinks.forEach(function (b) {
          frames.push(key(b, 1, 'ease-in'), key(b + 0.45 * BLINK, 0.1),
                      key(b + 0.51 * BLINK, 0.1, 'ease-out'), key(b + BLINK, 1));
        });
        eyes.animate(frames, { delay: at, duration: span, fill: 'both' });
      }

      // Every animation is created here, in one task, each with its own delay.
      function start() {
        var g = layout(), B = g.big;
        // Comes in as Atlas's hero: fades in big, grows from 0.85x out of a
        // blur (only the lead shows; the others wait behind it), then
        // shrinks to 1x around its feet and rises into place...
        lift.animate([{ opacity: 0 }, { opacity: 1 }],
                     { delay: FIRST, duration: FADE, fill: 'both' });
        zoom = row.animate(rowFrames(B), { delay: FIRST, duration: SHRINK_AT + SHRINK, fill: 'both' });
        row.animate([{ filter: 'blur(6px)' }, { filter: 'blur(0px)' }],
                    { delay: FIRST, duration: GROW, easing: EASE_SETTLE, fill: 'backwards' });
        rise = lift.animate([{ transform: 'translateY(' + g.drop + 'px)' }, { transform: 'translateY(0px)' }],
                            { delay: FIRST + SHRINK_AT, duration: SHRINK, easing: EASE_EXPO, fill: 'both' });
        // ...while the others fan out from behind it into the lineup, fading
        // in together and waking as they come.
        side.animate([{ opacity: 0 }, { opacity: 1 }],
                     { delay: FIRST + SIDE_AT, duration: SIDE_FADE, fill: 'both' });
        slots.forEach(function (s, i) {
          var eyes = s.querySelector('.eyes');
          var last = BLINK_AT + i * BLINK_GAP;   // all of them blink at the end
          if (i === LEAD) {
            // the lead wakes up and blinks while it is big
            wake(eyes, FIRST + WAKE_AT, [FIRST + BLINK1_AT, last]);
          } else {
            var at = FIRST + FAN_AT + TEAM[i][2];
            fans[i] = s.animate([{ transform: behind(g, i) }, { transform: placed(g, i) }],
                                { delay: at, duration: FAN, easing: EASE_FAN, fill: 'both' });
            wake(eyes, at + 250, [last]);
          }
        });
        titleIn();
        // "AutoCua" stays; one shimmer crosses it.
        var k = sheenTravel();
        sweep = sheen.animate([{ transform: 'translateX(' + (-k) + 'px)' }, { transform: 'translateX(' + k + 'px)' }],
                              { delay: SHEEN_AT, duration: SHEEN, easing: EASE_SHEEN, fill: 'both' });
        still = sheenArt.animate([{ transform: 'translateX(' + k + 'px)' }, { transform: 'translateX(' + (-k) + 'px)' }],
                                 { delay: SHEEN_AT, duration: SHEEN, easing: EASE_SHEEN, fill: 'both' });
        setTimeout(handOff, END);
        window.addEventListener('resize', layout);
      }

      // A layer that fails to load would draw a broken-image box: hide its
      // bot instead.
      var imgs = [].slice.call(document.querySelectorAll('.bot img'));
      imgs.forEach(function (im) {
        function broken() { im.closest('.bot').style.visibility = 'hidden'; }
        if (im.complete && !im.naturalWidth) broken();
        else im.addEventListener('error', broken);
      });

      if (reduced) {
        setTimeout(handOff, 600);
        settle();
        window.addEventListener('resize', settle);
        return;
      }

      // Start once every bot layer is decoded (they are small and local), so
      // no bot comes in half drawn; never wait more than DECODE_MAX for that.
      var started = false;
      function go() {
        if (started) return;
        started = true;
        try {
          start();
        } catch (e) {
          // No motion then, but the still end state and the hand-off.
          setTimeout(handOff, 600);
          if (document.getAnimations) {
            document.getAnimations().forEach(function (a) { a.cancel(); });
          }
          settle();
          window.addEventListener('resize', settle);
        }
      }
      Promise.all(imgs.map(function (im) {
        return im.decode ? im.decode().catch(function () {}) : null;
      })).then(go);
      setTimeout(go, DECODE_MAX);
    })();
  </script>
