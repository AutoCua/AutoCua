<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoCua Splash</title>
  <style>
    /* ------------------------------------------------------------------
       Splash: Mouse & Burst Entrance -> Ripple Loading -> Chain Collapse ->
               Melt -> Water-drop morph into the app's own boxes -> Hand off

       Timeline:
         0.00s - 0.60s   Mouse and burst lines scale & fade in
         0.35s - 2.00s   Burst lines ripple in sequence
         2.00s - 2.60s   Lines swing and merge into each other in a chain
         2.50s - 2.85s   The final merged line shoots into the mouse body
         2.90s - 3.20s   The mouse melts away
         2.90s - 4.00s   A droplet forms, condenses, and flows out into two
                         outlines that land on the real left bar and chat box
         4.00s           postMessage('splashDone') -> script.js fades the
                         overlay over 0.9s, dissolving the outlines off the
                         real UI sitting underneath them

       EVERYTHING HERE ANIMATES ON THE COMPOSITOR
       ------------------------------------------
       This plays in an iframe on top of the booting app, in WKWebView, and the
       host page saturates the main thread for the whole splash: 21 blocking
       scripts, 33 backdrop-filter surfaces, and a .splash-overlay deliberately
       held at opacity 0.999 so the app beneath cannot be occlusion-culled. Any
       frame that needs the main thread gets dropped.

       So nothing here may animate anything but `transform` and `opacity`,
       which WebKit runs off the main thread:

         - No transforms on SVG <g> — WebKit will not composite those. The
           burst is plain <div> hinges instead (see below).
         - No stroke-dashoffset — never composites anywhere. The ripple is a
           scaleY on a pill.
         - No top/left/width/height/border-radius/border-width — those are
           layout and paint. The two outlines are built from corner and edge
           pieces that are only translated and scaled (see section 4).
       ------------------------------------------------------------------ */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #F9F1EC;
      overflow: hidden;
    }

    .icon-container {
      position: relative;
      width: min(38vmin, 300px);
      height: min(38vmin, 300px);
      contain: layout paint;
    }

    /* --- 1. The Entrance --- */
    /* On the layer elements themselves, so it is a composited transform +
       opacity rather than a transform on an SVG group. Both layers share one
       document timeline, so they stay in lockstep. */
    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform-origin: 52.083333% 47.916667%;
      opacity: 0;
      will-change: transform, opacity;
      backface-visibility: hidden;
      animation: cursorEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes cursorEntrance {
      0%   { opacity: 0; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1); }
    }

    .burst-layer { z-index: 1; }

    .body-layer {
      z-index: 2;
      filter: drop-shadow(4px 6px 5px rgba(79, 54, 63, 0.15));
      /* Apply the entrance, then after the burst finishes, melt into a water drop */
      animation:
        cursorEntrance 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
        cursorMelt 0.3s 2.9s ease-in forwards;
    }

    @keyframes cursorMelt {
      0%   { transform: scale(1) translateY(0); opacity: 1; }
      /* The cursor simply melts into a small central droplet */
      100% { transform: scale(0.3); opacity: 0; visibility: hidden; }
    }

    /* Every hinge is a full-size box pinned to the container, so percentage
       geometry inside it stays relative to the container no matter how deep
       the nesting goes. All of them pivot about the same physical point (the
       burst origin), exactly like the old `transform-origin: 0px 0px` groups. */
    .hinge {
      position: absolute;
      inset: 0;
      transform-origin: 52.083333% 47.916667%;
    }

    .rot-55      { transform: rotate(55deg); }          /* the cursor's own tilt */
    .burst-origin { transform: translateY(-8.333333%); } /* old translate(0,-20) */

    /* --- 2. The Burst Ripple --- */
    /* The old stroke-dasharray:20 / stroke-dashoffset:8 drew 12 of the 20 units
       at rest and all 20 at the peak, with round caps adding 2.75 at each end:
       17.5 units at rest, 25.5 at the peak. So the div is built at the REST
       length and scaled to 25.5/17.5 = 1.4571429 — length interpolates linearly
       either way, so the motion is identical, and scaleY composites while
       stroke-dashoffset never could.

       Two iterations, not `infinite`: a third pulse would start at 2.95s at the
       earliest and the burst is already gone from 2.85s, so it is pixel
       identical — and it stops the splash repainting forever behind the app. */
    .ripple-line {
      position: absolute;
      left: 50.9375%;        /* (125 - 2.75) / 240 */
      top: 35.520833%;       /* (115 - 29.75) / 240 */
      width: 2.291667%;      /* 5.5 / 240  — the old stroke-width */
      height: 7.291667%;     /* 17.5 / 240 — rest length incl. round caps */
      border-radius: 999px;  /* pill = stroke-linecap: round */
      background: #4F363F;
      transform-origin: 50% 100%;  /* grows outward from the inner cap */
      will-change: transform;
      animation: sequentialRipple 1.3s 2 ease-in-out;
      animation-delay: var(--ripple-delay);
    }

    @keyframes sequentialRipple {
      0%        { transform: scaleY(1); }
      10%       { transform: scaleY(1.4571429); }
      20%, 100% { transform: scaleY(1); }
    }

    /* --- 3. The Chain Collapse --- */
    /* 'linear' with timings balanced against the angle gaps — all four sweep at
       333 deg/s, so the fan shuts in one continuous motion instead of stopping
       at each hinge. will-change keeps the layers up front so no layer has to
       be created mid-sweep. */
    .fold { will-change: transform; }

    .fold-1 { transform: rotate(-55deg); animation: foldIn 0.165s 2.000s linear forwards; }
    .fold-2 { transform: rotate(-45deg); animation: foldIn 0.135s 2.165s linear forwards; }
    .fold-3 { transform: rotate(-45deg); animation: foldIn 0.135s 2.300s linear forwards; }
    .fold-4 { transform: rotate(-55deg); animation: foldIn 0.165s 2.435s linear forwards; }

    /* Base rotation for the 5th line where they all gather */
    .fold-5 { transform: rotate(100deg); }

    @keyframes foldIn {
      to { transform: rotate(0deg); }
    }

    /* The final stacked lines shoot into the mouse seamlessly. Ends on
       visibility:hidden (held by `forwards`) so WebKit drops the whole burst
       subtree — and its layers — once it has vanished. */
    .shoot-group {
      will-change: transform, opacity;
      animation: shootIn 0.35s 2.50s cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes shootIn {
      0%   { transform: rotate(0deg) scale(1); opacity: 1; visibility: visible; }
      /* Just swing perfectly flush against the bottom right edge of the mouse. 
         No shrinking, no pulling inside - just folds onto the line and fades. */
      100% { transform: rotate(54deg) scale(1); opacity: 0; visibility: hidden; }
    }

    /* --- 4. The App UI Morph (Water Drop Splash) --- */
    /* Each outline is 8 pieces instead of one bordered box, because a bordered
       box cannot change size on the compositor:

         corners  a quarter-ring, built once at radius 40 / stroke 5. Only ever
                  translated and scaled UNIFORMLY, so the arc stays a true
                  circular arc and the stroke stays even all the way round.
                  scale s = radius/40, so s also sets the stroke: 5s.
         edges    plain rectangles. A rectangle scaled by (sx, sy) is still an
                  exact rectangle, so one axis sets the length and the other
                  sets the thickness — both exact, no distortion.

       Every piece is built at the LARGEST size it ever needs and scaled down,
       so nothing is ever rasterised below its display size.

       The geometry itself is computed in the script at the bottom, because the
       edge scale factors are length ratios and CSS cannot divide a length by a
       length. */
    .app-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* One opacity group per outline — a composited fade for all 8 pieces. */
    .ghost {
      position: absolute;
      inset: 0;
      opacity: 0;
      will-change: opacity;
    }

    .piece {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      backface-visibility: hidden;
    }

    .edge { background: #4F363F; }

    .corner {
      width: 40px;
      height: 40px;
      box-sizing: border-box;
      border-style: solid;
      border-color: #4F363F;
      border-width: 0;
    }

    /* Radius 40 on a 40x40 box = the arc fills the whole piece, so each of
       these is exactly one quarter of the ring. The origin is the piece's OUTER
       corner, so scaling pins it to the box's corner. */
    .c-tl { border-top-width: 5px;    border-left-width: 5px;  border-top-left-radius: 40px;     transform-origin: 0 0; }
    .c-tr { border-top-width: 5px;    border-right-width: 5px; border-top-right-radius: 40px;    transform-origin: 100% 0; }
    .c-bl { border-bottom-width: 5px; border-left-width: 5px;  border-bottom-left-radius: 40px;  transform-origin: 0 100%; }
    .c-br { border-bottom-width: 5px; border-right-width: 5px; border-bottom-right-radius: 40px; transform-origin: 100% 100%; }

    /* Edge origins are the side they are pinned to, so thickness grows inward. */
    .e-top   { transform-origin: 0 0; }
    .e-bot   { transform-origin: 0 100%; }
    .e-left  { transform-origin: 0 0; }
    .e-right { transform-origin: 100% 0; }

    @media (prefers-reduced-motion: reduce) {
      .layer { opacity: 1; transform: none; animation: none; }
      .ripple-line, .fold, .shoot-group { animation: none; }
      .shoot-group { display: none; }
    }
  </style>
</head>
<body>

  <div class="icon-container">

    <!-- Burst lines: HTML hinges so the collapse runs on the compositor, and
         painted BELOW the body so the merged line disappears behind the
         cursor on the shoot. -->
    <div class="layer burst-layer">
      <div class="hinge rot-55">
        <div class="hinge burst-origin">
          <div class="hinge shoot-group">
            <div class="hinge fold-5">
              <i class="ripple-line" style="--ripple-delay: 0.87s"></i>

              <div class="hinge fold fold-4">
                <i class="ripple-line" style="--ripple-delay: 0.74s"></i>

                <div class="hinge fold fold-3">
                  <i class="ripple-line" style="--ripple-delay: 0.61s"></i>

                  <div class="hinge fold fold-2">
                    <i class="ripple-line" style="--ripple-delay: 0.48s"></i>

                    <div class="hinge fold fold-1">
                      <i class="ripple-line" style="--ripple-delay: 0.35s"></i>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Cursor body: static geometry, keeps the drop-shadow. -->
    <svg class="layer body-layer" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(125, 115) rotate(55)">
        <path
          d="M 0,-20
             L -34,50
             L -8,44
             L -8,68
             L 8,68
             L 8,44
             L 34,50 Z"
          fill="none"
          stroke="#4F363F"
          stroke-width="5.5"
          stroke-linejoin="round"
          stroke-linecap="round"
        />
      </g>
    </svg>

  </div>

  <!-- The two outlines. Pieces are built by the script. -->
  <div class="app-ui">
    <div class="ghost" id="ghostSidebar"></div>   <!-- lands on .left-bar -->
    <div class="ghost" id="ghostChat"></div>      <!-- lands on .input-area-wrapper -->
  </div>

  <script>
    (function () {
      'use strict';

      // --------------------------------------------------------------
      // Where the two outlines land.
      //
      // These are the app's REAL boxes, so the morph has to finish exactly on
      // them or the cross-fade shows a jump. #splashFrame is exactly
      // full-window (.splash-overlay / #splashFrame in css/style.css), so a
      // rect measured in the parent needs no translation — its viewport
      // coordinates are ours. Same origin too, both served off 127.0.0.1:5000.
      //
      //   left bar -> left_bar/left_bar.css      `.left-bar`
      //   chat box -> chat_input/chat_input.css  `.input-area-wrapper`
      //
      // Opened standalone there is no parent, so fallback() mirrors those same
      // rules in JS and the preview still lands correctly.
      // --------------------------------------------------------------
      var MORPH_START = 2900;   // when the droplet appears
      var MORPH_DUR = 1100;     // how long it takes to reach the boxes
      var EASE = 'cubic-bezier(0.4, 0, 0.2, 1)';
      var OFFSETS = [0, 0.3, 1];
      var KEYS = ['tl', 'tr', 'bl', 'br', 'top', 'bot', 'left', 'right'];

      var CORNER_BASE = 40;     // corner pieces are built at radius 40 / stroke 5
      var STROKE_BASE = 5;

      var hosts = {
        sb: document.getElementById('ghostSidebar'),
        bb: document.getElementById('ghostChat')
      };
      var signature = '';       // last geometry we built for

      function clampPx(min, preferred, max) {
        return Math.min(Math.max(preferred, min), max);
      }

      // Mirrors the real CSS for a standalone preview. The chat box's height is
      // a layout result (one text row + the reserved orb row), so 84 is an
      // estimate here — in the app it is measured.
      function fallback() {
        var vw = window.innerWidth, vh = window.innerHeight;
        var barGap = clampPx(5, 0.007 * vw, 9);
        var barBottom = clampPx(14, 0.018 * vw, 22);
        var wrapW = clampPx(600, 0.65 * vw, 1000);
        var pad = clampPx(16, 0.02 * vw, 24);
        var chatBottom = clampPx(30, 0.04 * vw, 50);
        var chatH = 84;
        return {
          sb: {
            left: barGap, top: barGap,
            width: 240 - barGap, height: vh - barGap - barBottom,
            r: clampPx(12, 0.015 * vw, 16)
          },
          bb: {
            left: vw / 2 + 120 - wrapW / 2 + pad, top: vh - chatBottom - chatH,
            width: wrapW - 2 * pad, height: chatH,
            r: clampPx(16, 0.018 * vw, 22)
          }
        };
      }

      function parentDoc() {
        try {
          return window.parent === window ? null : window.parent.document;
        } catch (e) {
          return null;          // cross-origin — use the fallback
        }
      }

      // getBoundingClientRect() includes transforms, and .left-bar slides in on
      // translateX(-12px) -> 0 (left_bar.css). Measuring mid-reveal would bake
      // that offset into the landing position, so undo whatever translation is
      // live and keep the SETTLED rect. .input-area-wrapper has no transform of
      // its own, so its wrapper's translateX(-50%) centring is preserved.
      function settledRect(el) {
        var view = el.ownerDocument.defaultView;
        var r = el.getBoundingClientRect();
        var dx = 0, dy = 0;
        var t = view.getComputedStyle(el).transform;
        var m = t && t !== 'none' ? /matrix\(([^)]+)\)/.exec(t) : null;
        if (m) {
          var p = m[1].split(',');
          dx = parseFloat(p[4]) || 0;
          dy = parseFloat(p[5]) || 0;
        }
        var radius = parseFloat(view.getComputedStyle(el).borderTopLeftRadius) || 0;
        return {
          left: r.left - dx, top: r.top - dy,
          width: r.width, height: r.height, r: radius
        };
      }

      function targets() {
        var out = fallback();
        var doc = parentDoc();
        if (!doc) return { rects: out, live: false };
        // Both components are injected asynchronously (left_bar.js,
        // chat_input.js), so either may still be missing on an early pass.
        var pairs = [['sb', '.left-bar'], ['bb', '.input-area-wrapper']];
        var live = true;
        for (var i = 0; i < pairs.length; i++) {
          var el = doc.querySelector(pairs[i][1]);
          if (!el) { live = false; continue; }
          var rect = settledRect(el);
          if (rect.width > 0 && rect.height > 0) out[pairs[i][0]] = rect;
          else live = false;
        }
        return { rects: out, live: live };
      }

      // --------------------------------------------------------------
      // Piece geometry. For a box at (X, Y) of size W x H with corner radius r,
      // the corner scale is r/40 — which also gives the stroke, 5 * r/40. Each
      // piece's transform-origin is the box feature it is pinned to, so these
      // are pure placements with no compensation maths.
      // --------------------------------------------------------------
      function frame(st, lBase, hBase) {
        var X = st.left, Y = st.top, W = st.width, H = st.height, r = st.r;
        var s = r / CORNER_BASE;
        var ex = Math.max(0, W - 2 * r) / lBase;   // horizontal edge length
        var ey = Math.max(0, H - 2 * r) / hBase;   // vertical edge length
        var C = CORNER_BASE, T = STROKE_BASE;
        function tr(x, y, a, b) {
          return 'translate(' + x + 'px,' + y + 'px) scale(' + a + ',' + b + ')';
        }
        return {
          tl:    tr(X, Y, s, s),
          tr:    tr(X + W - C, Y, s, s),
          bl:    tr(X, Y + H - C, s, s),
          br:    tr(X + W - C, Y + H - C, s, s),
          top:   tr(X + r, Y, ex, s),
          bot:   tr(X + r, Y + H - T, ex, s),
          left:  tr(X, Y + r, s, ey),
          right: tr(X + W - T, Y + r, s, ey)
        };
      }

      // The droplet states are identical for BOTH outlines, so they sit exactly
      // on top of each other and read as one drop before they separate.
      function states(target) {
        var cx = window.innerWidth / 2, cy = window.innerHeight / 2;
        return [
          // The drop forms: an 80px circle (4 quarter-arcs, edges at zero length).
          { left: cx - 40, top: cy - 40, width: 80, height: 80, r: 40 },
          // Condensed into a capsule.
          { left: cx - 16, top: cy - 30, width: 32, height: 60, r: 16 },
          // Flows out onto the real box.
          target
        ];
      }

      function build(prefix, target) {
        var host = hosts[prefix];
        host.textContent = '';
        // Build every piece at the largest size it will ever need, so all
        // scaling is downward and nothing is rasterised below display size.
        var lBase = Math.max(1, target.width - 2 * target.r);
        var hBase = Math.max(1, target.height - 2 * target.r);
        var els = { _l: lBase, _h: hBase };

        ['tl', 'tr', 'bl', 'br'].forEach(function (k) {
          var d = document.createElement('div');
          d.className = 'piece corner c-' + k;
          host.appendChild(d);
          els[k] = d;
        });
        [['top', lBase, STROKE_BASE], ['bot', lBase, STROKE_BASE],
         ['left', STROKE_BASE, hBase], ['right', STROKE_BASE, hBase]
        ].forEach(function (e) {
          var d = document.createElement('div');
          d.className = 'piece edge e-' + e[0];
          d.style.width = e[1] + 'px';
          d.style.height = e[2] + 'px';
          host.appendChild(d);
          els[e[0]] = d;
        });
        return els;
      }

      function sync() {
        var t = targets();
        var rects = t.rects;
        var sig = JSON.stringify(rects);
        if (sig === signature) return t.live;
        signature = sig;

        var reduced = window.matchMedia &&
          window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        // Negative delay = already in progress, so a rebuild mid-morph (a
        // resize, or a late-arriving measurement) resumes at the same point
        // instead of restarting.
        var delay = MORPH_START - performance.now();

        ['sb', 'bb'].forEach(function (prefix) {
          var target = rects[prefix];
          var els = build(prefix, target);
          var frames = states(target).map(function (st) {
            return frame(st, els._l, els._h);
          });
          var host = hosts[prefix];

          if (reduced) {
            KEYS.forEach(function (k) { els[k].style.transform = frames[2][k]; });
            host.style.opacity = '1';
            return;
          }

          KEYS.forEach(function (k) {
            els[k].animate(
              OFFSETS.map(function (o, i) {
                return { offset: o, transform: frames[i][k], easing: EASE };
              }),
              { duration: MORPH_DUR, delay: delay, fill: 'both' }
            );
          });
          host.animate(
            [{ offset: 0, opacity: 0 }, { offset: 0.1, opacity: 1 },
             { offset: 1, opacity: 1 }],
            { duration: MORPH_DUR, delay: delay, fill: 'both', easing: EASE }
          );
        });
        return t.live;
      }

      // Poll while the app injects its components, then take one final reading
      // just before the morph starts.
      sync();
      var poll = setInterval(function () { if (sync()) clearInterval(poll); }, 100);
      setTimeout(function () { clearInterval(poll); sync(); }, MORPH_START - 60);
      window.addEventListener('resize', sync);

      // Hand off once the outlines have settled onto the real UI: script.js
      // fades .splash-overlay over 0.9s, dissolving these outlines away and
      // revealing the left bar and chat box in exactly the same place.
      var reducedNow = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      setTimeout(function () {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage('splashDone', '*');
        }
      }, reducedNow ? 600 : MORPH_START + MORPH_DUR);
    })();
  </script>

</body>
</html>
