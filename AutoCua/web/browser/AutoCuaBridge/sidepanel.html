<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AutoCua</title>
<style>
  /* The desktop app's look (AutoCua/ui/chat_input), in white: its borderless box
     with a soft shadow, its type and its greys. */
  :root { color-scheme: light; --page: #fff; --box: #fff; --shadow: 0 2px 12px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04); --ink: rgba(60, 60, 60, 0.95); --soft: rgba(90, 90, 90, 0.6); --hover: rgba(0, 0, 0, 0.05); --bubble: #7c3aed; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; font: 500 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--page); }
  /* Top right: History and New chat, round, each with its name below it on hover. */
  .top { position: relative; z-index: 2; display: flex; justify-content: flex-end; gap: 8px; padding: 10px 10px 0; }
  .round { position: relative; width: 32px; height: 32px; padding: 0; border: 0; border-radius: 50%; background: var(--box); box-shadow: var(--shadow); color: var(--soft); display: grid; place-items: center; cursor: pointer; transition: color 0.2s ease; }
  .round:hover { color: var(--ink); }
  .round:hover::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); right: 0; padding: 4px 8px; border-radius: 6px; background: var(--ink); color: #fff; font-size: 11px; white-space: nowrap; pointer-events: none; }
  #messages { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  #hint { margin: auto; text-align: center; font-size: 22px; font-weight: 700; letter-spacing: -0.2px; color: rgba(90, 90, 90, 0.45); }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
  .me { align-self: flex-end; background: var(--bubble); color: #fff; border-bottom-right-radius: 4px; }
  .note { align-self: flex-start; color: var(--soft); font-size: 12px; padding: 0 2px; }
  /* The box, as the desktop app's: the text on top, and a row reserved under it for the
     tools (Model on the left, the send orb on the right). */
  form { position: relative; margin: 0 10px 10px; padding: 7px 12px calc(7px + 34px + 4px); border-radius: 18px; background: var(--box); box-shadow: var(--shadow); }
  textarea { display: block; width: 100%; box-sizing: border-box; height: 30px; min-height: 30px; max-height: 150px; margin: 0; padding: 4px; border: 0; outline: 0; resize: none; font: inherit; color: var(--ink); background: transparent; scrollbar-width: none; }
  textarea::placeholder { color: var(--soft); }
  .tools { position: absolute; left: 12px; right: 12px; bottom: 7px; height: 34px; display: flex; align-items: center; justify-content: space-between; }
  .model { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 6px 0 4px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: background-color 0.2s ease; }
  .model:hover { background: var(--hover); }
  .model svg { width: 14px; height: 14px; color: rgba(90, 90, 90, 0.65); }
  /* The send orb: the desktop app's own (send_button.html), 42 px, centred on its slot. */
  .orb { position: relative; flex: none; width: 34px; height: 34px; }
  .orb iframe { position: absolute; top: 50%; left: 50%; width: 42px; height: 42px; transform: translate(-50%, -50%); border: 0; background: transparent; }
</style>
</head>
<body>
<div class="top">
  <button class="round" id="history" data-tip="History" aria-label="History">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
  </button>
  <button class="round" id="new-chat" data-tip="New chat" aria-label="New chat">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
  </button>
</div>
<div id="messages"><div id="hint">Made To Do&nbsp;!</div></div>
<form id="composer">
  <textarea id="text" rows="1" placeholder="Message AutoCua…" aria-label="Message"></textarea>
  <div class="tools">
    <button class="model" id="model" type="button" aria-label="Model">Model<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"/></svg></button>
    <div class="orb"><iframe id="orb" src="send_button.html" title="Send" scrolling="no"></iframe></div>
  </div>
</form>
<script src="sidepanel.js"></script>
</body>
</html>
